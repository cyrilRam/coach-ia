analyse_coach:
  maj: '2026-10-11'
  synthese: >
    S1 Bloc-01 réussie. Volume 10h06 (+9% vs cible 9h15), charge maîtrisée
    (Ramp Rate 1.02, TSB -3.0, TSS 472). Structure respectée malgré VT mercredi
    annulé (pluie). Sommeil excellent (8h18), FC repos 53.3 bpm et HRV 55.3
    enregistrées comme baseline. Motivation au top.
    Vigilance : fatigue ressentie jeudi-samedi + impression de coup de froid
    mercredi après la pluie. Cardio haut samedi sur Col St Roch (230W = 74% FTP)
    avec jambes lentes à démarrer — hypothèse principale : découplage Pw:HR
    classique de reprise post-coupure, mais croisement avec fatigue et coup de
    froid impose surveillance renforcée en W42.
    Trail Mont Chauve un peu fort (au-delà de Z2 conversationnel prescrit) —
    rappel de polarisation. Renfo jeudi jugé trop facile par Cyril, durcissement
    validé pour S2.
  decision: >
    Continuer progression S2 bloc-01 (volume ~10h15) sauf alerte santé.
    Surveiller FC repos, HRV et énergie lundi-mardi W42. Si coup de froid
    confirmé (FC repos > 58 bpm, HRV < 48-50, gorge irritée) : passer en
    Z1/Z2 basse et reporter sprints du WE. Trail sur parcours moins pentu
    ou marcher les sections raides pour rester Z2. Durcir renfo jeudi S2
    (charges légères, tempos excentriques allongés, fentes bulgares).

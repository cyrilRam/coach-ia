analyse_coach:
  maj: '2026-09-28'
  synthese: >
    SEMAINE DE COUPURE RÉALISÉE (données finales lun→dim) — 4.3h de selle, 147 TSS,
    93 km, 1014 m D+ sur 4 séances. Ratio de charge ~3.5x inférieur à W38 (523 TSS / 13h).
    Coupure franche et parfaitement conforme au plan prescrit.

    CHARGE & FITNESS (valeurs finales) —
    • CTL : 72.7 → 64.7 (-8.0 pts). Décrochage attendu et normal pour une coupure.
    • ATL : 89.6 → 43.7. Fatigue aiguë intégralement purgée.
    • TSB : -16.9 → +21.0. Fraîcheur maximale, le plus haut TSB observé depuis le suivi.
    • Ramp Rate : -8.05. Décharge volontaire franche, aucun garde-fou déclenché.

    SANTÉ & SIGNAUX — Données Garmin CIRQA (deuxième semaine complète) :
    • Sommeil moyen : 8.3h (en hausse vs 7.8h en W38 et 8.0h en milieu de W39). Excellent,
      et d'autant plus remarquable compte tenu du contexte (soirées boulot mercredi/jeudi
      avec alcool, déménagement stressant vendredi-samedi-dimanche).
    • HRV moyenne : 49.0 ms (en légère baisse vs 55.0 en W38, mais en remontée vs la
      mesure de milieu de semaine à 47.8). Baseline CIRQA toujours en construction — la
      tendance importe plus que la valeur absolue, et la remontée en fin de semaine est
      un signal positif.
    • FC repos moyenne : 55.3 bpm (plus bas historique, en amélioration vs 55.7 en milieu
      de semaine et vs 63.1 en W38). Marqueur de récupération profonde confirmé.

    CROISEMENT MÉTRIQUES/RESSENTI — Convergence très nette sur tous les axes :
    • Jambes « totalement reposées » + FC repos au plancher (55.3) = récupération
      neuromusculaire complète.
    • Footing samedi avec « vrai respect de la Z2 » = consigne d'intensité respectée à la
      lettre (bonne discipline malgré les jambes fraîches qui poussaient à accélérer).
    • Sommeil 8.3h malgré un contexte de vie chargé (déménagement + soirées) = résilience
      du sommeil confirmée.
    • Première coupure volontaire, zéro culpabilité, « ça fait du bien au cerveau » =
      excellent marqueur psychologique. Cyril aborde la saison avec un mental sain et une
      maturité de gestion de la récupération.
    • Le déménagement (restitution appart Paris, ven-sam-dim) a ajouté une fatigue
      physique extra-sportive notable (port de charges, stress logistique). Cela n'a pas
      perturbé les marqueurs physiologiques mais c'est un facteur à intégrer pour W40.

    BILAN DE TRAJECTOIRE W36→W39 (4 semaines post-maladie/vacances) :
    • W36 : relance douce (CTL 65.7, TSB +11.5, FC repos 76.5 — post-maladie)
    • W37 : grosse semaine (CTL 72.0, TSB -21.7, FC repos 59.7 — retour des jambes)
    • W38 : confirmation PR (CTL 72.7, TSB -16.9, FC repos 63.1 — PR Èze + Braus)
    • W39 : coupure (CTL 64.7, TSB +21.0, FC repos 55.3 — purge complète)
    Le schéma relance → charge → surcompensation → coupure est textbook. Le CTL a perdu
    8 points mais c'est le prix attendu. La FC repos est passée de 76.5 à 55.3 en 4
    semaines : le système autonome est parfaitement rétabli.

  decision: >
    SEMAINE W40 (28/09 → 04/10) : DERNIÈRE SEMAINE DE COUPURE — Le TSB à +21 est très
    haut, signe que la fitness décroche. C'est normal et voulu, mais il ne faut pas
    prolonger la coupure au-delà du 04/10. Consignes : 2-3 sorties courtes Z1 pure
    (< 1h vélo moulinette ou footing léger FC < 148 bpm) pour entretenir la souplesse.
    ZÉRO intensité. Attention à la fatigue résiduelle du déménagement : privilégier le
    sommeil et l'hydratation.

    BLOC 01 (REPRISE & CAPACITÉ AÉROBIE) — Début confirmé lundi 05/10. Profil de
    démarrage idéal : CTL estimé ~60-62, TSB positif, FC repos au plancher, mental
    frais. Première semaine à 8h, Z2 stricte, sprints courts alactiques en fin de
    sortie. Le corps est prêt à absorber la montée en charge progressive.

    NOTE HRV — Continuer à porter le CIRQA chaque nuit. D'ici fin W40, 3 semaines de
    données seront disponibles et la baseline commencera à être exploitable pour le
    pilotage du Bloc 01.


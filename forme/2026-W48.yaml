    ressenti_cyril:

  - date: '2026-11-24'
    moment: matin
    nuit: {sommeil_h: 7.1, score: 78, vfc_ms: 47, vfc_moy7: 54.4, fc_repos: 55, fc_repos_moy7: 54.4}

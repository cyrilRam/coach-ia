      courbatures, frissons) ; au moindre doute, repos et tu me le dis ici. Séance maintenue :
      90 min de Z2 vraiment souple, FC <= 164 qui commande, aucune bosse appuyée, aucune Z3. Ce n'est
      pas une séance pour se faire mal, la VO2max arrive jeudi. Renfo le soir, 2 séries RPE 7, pas

      on en parle avant. Au moindre symptôme (nez, gorge, courbatures, frissons) : repos. Rien
      modifié sur Intervals.
    ressenti_cyril: >
      VFC basse expliquée par des coupures de mesure dans la nuit et un lever tôt à 6h15
      (donc VFC et durée de sommeil sous-estimées). Creux isolé à cause connue, non retenu comme signal.


      Aucun seuil de veto touché : nuit de 7h08 (score 78), FC repos 55, VFC 47 ms (-14 % vs moyenne
      7 jours 54,4, mais bien au-dessus de 42 ; second creux en 3 jours après celui de 48 dimanche,

analyse_coach:
  maj: '2026-11-08'
  synthese: >
    POINT MI-SEMAINE (lun-mer) — S2 BLOC-02. Réalisé : 4 VT (2 A/R, 4h32,
    176 TSS, sans capteur de puissance, lecture à la FC). Renfo force du lundi
    sauté (manque de temps). CTL 69.6, ATL 82.8, TSB -13.2 (-21.0 dimanche),
    Ramp Rate 2.6. Aucun garde-fou déclenché.

    SANTÉ — Lundi et mardi : VFC 67 et 70 ms contre 59.3 de moyenne en W44
    (+13 à +18 %), FC repos 53 puis 52 : le plateau à 53-54 de la semaine
    dernière se casse. Lecture : absorption du samedi record 5h + force de
    dimanche, aidée par le lundi sans séance. Mercredi : VFC 52 ms (-12 %),
    nuit de 7h22 (score 82), lever tôt et stress de la veille. Cause
    identifiée, FC repos stable à 52, et VT du matin sous la pluie à FC 147
    (4 min en Z3 FC), identique aux VT des semaines précédentes : pas de
    dérive. Jeudi : VFC 60, FC repos 53, 8h07 de sommeil = retour à la
    ligne de base en 24h. Creux aigu et expliqué, pas un signal infectieux.
    Seuils d'assimilation anticipée (FC repos 56 deux matins, VFC < 50, deux
    nuits < 7h / score 70) non atteints.

    CONTRAINTE — Pluie forte jeudi et vendredi, pas de home trainer : la
    force 3x12' de jeudi midi ne peut pas se faire dehors.

    MAJ VENDREDI 06/11 — Renfo jambes S2 fait jeudi 14h52 (53'). Ce matin :
    VFC 51 ms (-14 % vs ligne de base ~60), FC repos 54 (+1 à +2), sommeil
    8h56 score 87. Précision de Cyril : la montre a clos la nuit à 6h30 alors
    qu'il a dormi jusqu'à 8h, la VFC est donc calculée sans la dernière 1h30
    de sommeil. Valeur peu comparable aux autres nuits, à ne pas lire comme
    un deuxième creux. FC repos quasi stable et sommeil excellent : aucun
    signal infectieux. Le report de la 3x12' tient sur les autres arguments
    (renfo excentrique de la veille, enchaînement avant la grosse semaine).

    BILAN DE SEMAINE (08/11) — 12,1 h, 471 TSS, 265 km, 4315 m D+, 8
    séances (-7 % vs ~13 h prévues). CTL 71,2 (+1,4), ATL 89,4, TSB -18,3,
    Ramp Rate 1,4 : aucun garde-fou de charge déclenché. Une seule séance
    de force vélo : renfo du lundi sauté, force du jeudi remplacée par le
    renfo en salle (pluie, pas de home trainer), trail du dimanche annulé
    sur veto santé. Samedi : 5h19, 241 TSS, 2895 m D+, NP 210 W, 4 efforts
    à 255-257 W (82-83 % FTP, ~34 min, au-dessus des 78-82 % de la 4x10'
    initiale) malgré une consigne orange (Z2 stricte), plus 67 min de Z3
    hors blocs = zone grise non planifiée. Physio propre (découplage 8,8 %,
    EF 1,37), mais coût visible le lendemain.

    SANTÉ — VFC 67, 70, 52, 60, 51, 48, 46 ms (moyenne 56,3 contre ~59 en
    W44) et FC repos 52 → 57 en cinq jours (+5 bpm), alors que le sommeil
    reste bon (8,1 h de moyenne, scores 78-87). Trois matins de VFC en
    baisse consécutive, deux sous 50, FC repos au-dessus du seuil de 56 ce
    dimanche. Lecture : charge cumulée + stress thermique (froid humide
    vendredi, 5 → 20 °C trop couvert samedi) + 241 TSS sur une VFC déjà
    basse. Pas de symptôme déclaré, mais c'est le profil « tout va bien » à
    ne pas masquer : 6 semaines de charge sans coupure depuis le 05/10.

    RESSENTI DE CYRIL — Semaine mitigée, gâchée par la météo, impression
    de n'avoir fait qu'une seule séance qualitative ; jambes bonnes samedi ;
    un peu dégoûté ; un peu fatigué ce dimanche ; sommeil RAS. Il juge
    lui-même que l'assimilation est la meilleure option, la saison étant
    encore très jeune. Il estime le bloc force moins prioritaire que prévu :
    il roule en montagne toute l'année avec beaucoup de D+, et chaque VT
    comporte environ 10 min de raidars en force.
    BLOC MAINTENU, FIN DE SEMAINE RÉORGANISÉE. Jeudi : pas de vélo, renfo
    force bas du corps S2 à la place de la sortie midi (le plus tôt possible,
    pour garder 48h avant samedi), 3 séries au lieu de 4 sur squat 1,5,
    fentes bulgares et SDT roumain. Vendredi : repos vélo + renfo posture et
    haut du corps 30' (aucune jambe) : les 2 renfos de la semaine sont
    tenus. Samedi : sortie longue 5h30, la 3x12' à 83-87 % (257-270 W, 55-60
    rpm, récup 4' Z1) remplace la 4x10' à 78-82 %, placée entre 1h et 2h30
    dans le premier grand col. Avec TSB autour de -5 samedi, c'est la séance
    à frapper fort : puissance plate, viser 265-270 W sur la 3e répétition
    si la 1re est propre, jamais au-dessus de 270 W. Hors blocs : plafond
    232 W (4e rappel), pas de sprint. On ne cumule pas 3x12' et 4x10' dans
    la même sortie. Dimanche : trail obligatoire (dernier le 25/10), 1h20,
    alerte FC 160, marcher dès qu'elle sonne. Météo : si samedi pluvieux et
    dimanche sec, trail samedi et sortie longue avec la 3x12' dimanche ; si
    pluie les deux jours, sortie raccourcie à 3h-3h30 avec la 3x12', pas de
    5h30 sous la pluie froide. Volume attendu ~11h20 (-13 % vs 13h prévues),
    une seule séance de force vélo : la séance perdue n'est pas reportée en
    S3. Assimilation toujours en S4 (W47), mêmes déclencheurs.

    MAJ 06/11 — Pas de 3x12' vendredi midi malgré l'arrêt de la pluie :
    jambes à moins de 24h d'un renfo excentrique, et la faire aujourd'hui
    collerait force + 5h30 + trail sur trois jours avant la plus grosse
    semaine du bloc. Vendredi midi : 1h Z1 à plat (moins de 60 % FTP, FC sous
    130), pas de bosse, optionnelle ; repos complet si courbatures marquées
    ou temps instable (pas de risque de se faire tremper avant le WE). Samedi : 3x12'
    dans la sortie longue maintenue SI au réveil FC repos ≤ 55 et jambes sans
    courbatures, VFC ≥ 50 sur une nuit mesurée en entier (sinon on ne tient
    pas compte de la VFC) ; sinon 5h Z2 stricte sans blocs, plafond 232 W.
    Volume W45 attendu ~12h20 avec la Z1 du jour : les 14h40 de la W46 restent
    sous +30 %.

    RÉALISÉ VENDREDI 06/11 — Sortie sur VT (sans capteur de puissance) : 1h21,
    30 km, 646 m D+, FC moy. 129 / max 159, 14 min en Z2 FC, reste en Z1, 13 °C
    et pluie légère. Écart à la prescription : +21 min et 646 m D+ pour un
    plat prévu, FC moyenne pile sous le plafond de 130. Ressenti de Cyril :
    « impression de pas forcer et j'avançais bien » : FC basse pour l'effort,
    cohérent avec une forme réelle correcte, pas de signe d'alerte. Volume
    W45 réel attendu ~12h45 : W46 à 14h40 = +15 %, largement sous la limite
    de +30 %, la Z2 de jeudi 12 reste en l'état.

    DÉCISION DE FIN DE SEMAINE (08/11), validée avec Cyril — ASSIMILATION
    AVANCÉE EN W46. Application de la clause de la saison : « si sommeil/FC
    repos/VFC clignotent, S3 devient l'assimilation ». Météo très pluvieuse
    annoncée sur la W46 : la grosse semaine (14h40, force du férié et du
    dimanche) n'aurait de toute façon pas pu se faire correctement sans home
    trainer. W46 : lundi repos complet ; mardi VT Z2 souple si FC repos ≤ 55,
    transports si pluie ; mercredi férié 2h Z2 souple à plat ou renfo
    d'entretien si pluie ; jeudi renfo d'entretien ; vendredi repos ; WE :
    sortie longue Z2 souple 4h30-5h (plafond 225 W, 6 départs arrêtés) le
    jour le plus sec, réduite à 2h30-3h ou supprimée sous pluie froide, et
    trail souple 1h (alerte FC 155) l'autre jour, prioritaire sur le vélo
    (dernier trail le 25/10). Pas de plancher de volume, rien n'est
    rattrapé. Aucune intensité avant deux matins consécutifs à FC repos ≤ 54
    et VFC ≥ 52 ; FC repos ≥ 57 avec un symptôme = 48h de repos complet.
    W47, validée avec Cyril : passerelle vers le bloc PMA, force courte en
    Z4-Z5, lancée seulement après deux matins consécutifs à FC repos ≤ 54 et
    VFC ≥ 52. Lundi renfo force (RPE 7-8) ; mardi et mercredi VT Z2 ; jeudi
    midi 6x3' à 93-97 % FTP à 50-55 rpm + renfo posture ; vendredi repos ;
    samedi 4h30 avec 2x5x1' à 110-115 % FTP à 65-75 rpm ; dimanche
    optionnel 6x(4' à 88-92 % à 50 rpm + sprint 10 s), supprimé au moindre
    signal santé. Volume plafonné à +30 % du réel de la W46 (on raccourcit
    d'abord le samedi, puis on supprime le dimanche). Prochain trail le
    29/11. Bloc 3 PMA au 23/11 inchangé. La séance de force perdue en W45
    n'est pas rattrapée.

    MAJ 08/11 — W47 réaménagée avec Cyril : formation peut-être en
    présentiel toute la semaine (fixé le lundi 16) et WE avec son frère.
    Lundi renfo force ; mardi et mercredi VT Z2, supprimés les jours de
    présentiel ; plus de séance le jeudi midi, renfo posture jeudi soir ;
    samedi 2h avec 2x5x1' à 110-115 % FTP ; dimanche 2h avec 6x3' à 93-97 %
    FTP à 50-55 rpm (Z2 souple si samedi raté ou signal santé). Pas de
    sortie longue. Volume ~5h15 (présentiel) à ~9h35. Conséquence : la
    règle des +30 % plafonne la W48 (S1 du bloc 3) à 1,3 fois le réel de
    la W47, soit ~7h si présentiel ; bloc 3 à construire en rampe
    progressive (~7h, ~9h, ~11-12h). Rappel polarisation :
    les raidars du VT se montent assis, sans chercher la puissance ; ils ne
    comptent pas comme travail de force.

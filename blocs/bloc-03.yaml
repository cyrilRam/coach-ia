    intervalles:
      - { type: echauffement, duree_min: 25, cible: 60-75% }
      - { type: effort, repetitions: 13, duree_s: 30, cible: 115-120%, cadence: 90-100, recup_s: 15, recup_cible: 50-60% }
      - { type: continu, duree_min: 3, cible: 48-52% }

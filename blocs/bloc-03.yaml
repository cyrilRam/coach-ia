    duree_min: 300
    description: "Lendemain de VO2max. Z2 stricte pendant 2h30, puis dans un col regulier : 2 series de 6 x 1 min a 110-115 %, recup 1 min Z1, 8 min Z1-Z2 entre les series. La derniere minute aussi forte que la premiere. Puis Z2 stricte jusqu'a la fin. C'est la premiere chose qui saute au moindre signal : la sortie reste alors 5h en Z2. 60-90 g de glucides par heure."
    intervalles:
      - { type: echauffement, duree_min: 20, cible: 60-70% }
      - { type: continu, duree_min: 130, cible: 62-72% }
      - { type: effort, repetitions: 6, duree_min: 1, cible: 110-115%, cadence: 75-90, recup_min: 1, recup_cible: 50-55% }
      - { type: continu, duree_min: 8, cible: 55-65% }
      - { type: effort, repetitions: 6, duree_min: 1, cible: 110-115%, cadence: 75-90, recup_min: 1, recup_cible: 50-55% }
      - { type: continu, duree_min: 106, cible: 62-75% }
      - { type: retour_calme, duree_min: 10, cible: 55-65% }


      - Planche laterale : 45s/cote

      4. Decompression (4 min) : psoas, ischios, fessiers.

  - jour: 12
    sport: Ride
    nom: VO2max 4x5' variees (40s/1')
    duree_min: 80
    description: "Seance du jeudi decalee (auto-ecole). Pause dej, montee reguliere. Echauffement 25 min. 4 repetitions de 5 min, chacune = 3 x (40s a 115-120 % + 1 min a 98-102 %), recup 3 min a 50 %. Le 1 min a FTP n'est pas une recuperation : la FC doit rester haute. Cadence 85-95 rpm. Arret si la 4e ne tient pas 320 W de moyenne."
    intervalles:
      - { type: echauffement, duree_min: 25, cible: 60-75% }
      - { type: effort, repetitions: 3, duree_s: 40, cible: 115-120%, cadence: 85-95, recup_min: 1, recup_cible: 98-102% }
      - { type: continu, duree_min: 3, cible: 48-52% }
      - { type: effort, repetitions: 3, duree_s: 40, cible: 115-120%, cadence: 85-95, recup_min: 1, recup_cible: 98-102% }
      - { type: continu, duree_min: 3, cible: 48-52% }
      - { type: effort, repetitions: 3, duree_s: 40, cible: 115-120%, cadence: 85-95, recup_min: 1, recup_cible: 98-102% }

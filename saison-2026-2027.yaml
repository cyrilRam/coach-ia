# Objectifs et architecture de saison.
# Rempli par Cyril, puis complete par l'agent apres validation explicite
# de chaque etape de la construction.

saison: 2026-2027
debut: 2026-10-01

federations:
  pratiquees: [FFC, FSGT, cyclosportive]
  prioritaire: null


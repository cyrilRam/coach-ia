    duree_semaines: 3
    objectif: gerer la fraicheur, enchainer les epreuves de mai sans s'epuiser
    focus: [recup_active, maintien_puissance, fraicheur_course]
    courses:
      - "Lazardieres Cannes (debut mai 2027)"
      - "Grandfondo La Vencoise (2e WE mai 2027)"

# Rempli apres l'etape "architecture de saison" validee en conversation.
blocs:
  - id: bloc-01
    nom: Reprise & Capacité Aérobie
    du: 2026-10-05
    au: 2026-11-01
    duree_semaines: 4
    objectif: reconstruire la base aerobie, le rythme moteur et les adaptations tendineuses
    focus: [Z2, sprints_courts_alactiques, reprise_trail, ppg]
    volume_cible_h: [8, 14]
    rythme: "4 semaines progressives de reprise et foncier (8h à 14h) sans assimilation (sortie de coupure)"
    fichier: blocs/bloc-01.yaml

  - id: bloc-02
    nom: Force Sous-Max & Couple (Torque)
    du: 2026-11-02
    au: 2026-11-29
    duree_semaines: 4
    objectif: developper la force musculaire en col et le recrutement neuro en bosse
    focus: [force_basse_cadence_z3, sprints_depart_arrete, sortie_longue_5h]
    volume_cible_h: [10, 14]
    rythme: "Cycle 3:1 -> 3 semaines de charge progressive (10h à 14h) + 1 semaine d'assimilation (8h)"

  - id: bloc-03
    nom: Foncier Étendu & Sweet Spot Base
    du: 2026-11-30
    au: 2026-12-27
    duree_semaines: 4
    objectif: consolider le moteur aerobie, allonger l'endurance et introduire le Sweet Spot
    focus: [sweet_spot_intro, maintien_sprints, volume_hivernal]
    volume_cible_h: [10, 14]
    rythme: "Cycle 3:1 -> 3 semaines de charge (11h à 14h) + 1 semaine d'assimilation fêtes (8h)"

  - id: bloc-04
    nom: Sweet Spot Extensif
    du: 2026-12-28
    au: 2027-01-24
    duree_semaines: 4
    objectif: allonger le temps de soutien au Sweet Spot en col et repousser l'apparition de la fatigue
    focus: [test_terrain_3m_12m, sweet_spot_long, endurance_fatigue, sorties_samedi_5h30]
    test: "Test terrain 3 min + 12 min début janvier (semaine du 4 janv) pour calibrer les zones Sweet Spot / Seuil"
    volume_cible_h: [12, 15]
    rythme: "Cycle 3:1 -> S1 Test 3m+12m & montée en charge (12h à 15h) + S4 assimilation (8h)"

  - id: bloc-05
    nom: Seuil Z4 & Over-Unders
    du: 2027-01-25
    au: 2027-02-21
    duree_semaines: 4
    objectif: elever le seuil anaerobie et entrainer le recyclage du lactate en montagne
    focus: [seuil_z4, over_unders, resistance_dplus, test_controle_fevrier]
    test: "Test de contrôle 3 min + 12 min fin février (semaine du 15 fév) pour valider la progression avant Paris-Nice"
    volume_cible_h: [12, 15]
    rythme: "Cycle 3:1 -> 3 semaines charge haute (12h à 15h) dont test de contrôle en S4 + 1 semaine d'assimilation / décharge (8h)"

  - id: bloc-06
    nom: Spécifique & Affûtage Paris-Nice
    du: 2027-02-22
    au: 2027-03-14
    duree_semaines: 3
    objectif: transformer les gains hivernaux en allure de course et reussir la premiere cyclo cible
    focus: [pacing_montagne, specifique_course, affutage_pre_course]
    course: "Paris Nice Challenge (13 mars 2027 - 150 km, 3500 D+)"
    volume_cible_h: [8, 13]
    rythme: "S1-S2 specifique et pacing (12-13h) -> S3 SEMAINE D'AFFUTAGE (volume -40%, 8h, debloquage Z4 court, TSB positif pour la course du 13 mars)"

  - id: bloc-07
    nom: PMA & Rythme Punchy
    du: 2027-03-15
    au: 2027-04-18
    duree_semaines: 5
    objectif: relancer la PMA rapidement post-PNC et convertir en puissance sur bosses nerveuses
    focus: [transition_rapide_pnc, pma_z5, bosses_courtes, affutage]
    courses:
      - "Mercan'Tour Madone-Peille (04 avril 2027)"
      - "GFNY Cannes (mi-avril 2027)"
    volume_cible_h: [8, 12]
    rythme: "S1 transition active (début de semaine vélotaf souple, démarrage PMA en fin de semaine) -> S2 gros bloc PMA en bosse -> S3 SEMAINE D'AFFUTAGE (8h) & Madone-Peille -> S4 rappel rythme -> S5 SEMAINE D'AFFUTAGE (8h) & GFNY Cannes"

  - id: bloc-08

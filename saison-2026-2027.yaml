    objectif: pic de forme absolu pour le monument de la saison (177 km, 4800 D+)
    focus: [haute_montagne, pacing_bonette, nutrition_course, affutage_deux_semaines]
    course: "MERCAN’TOUR BONETTE (13 juin 2027 - 177 km, 4800 D+)"
    volume_cible_h: [7, 15]
    rythme: "S1 SEMAINE RECUP POST-VENCOISE (8h) -> S2-S3 semaines chocs specifiques cols (14-15h, sorties 6h) -> S4 AFFUTAGE S-2 (10h) -> S5 AFFUTAGE FINAL S-1 (6-7h, debloquage court, pic TSB +10 le 13 juin)"

# Synthese validee de la session de construction du programme.
# C'est le document de reference : l'agent s'y appuie pour construire
# chaque nouveau bloc.
synthese_construction:
  date: "2026-09-12"
  texte: >
    Cadrage saison 2026/2027 validé avec Cyril.
    Reprise officielle le lundi 05/10/2026 après coupure régénératrice du 23/09 au 04/10.
    Volume disponible : entre 8h et 15h d'entraînement par semaine.
    Règles physiologiques cardinales du plan :
    1. Structure des mésocycles : cycle 3:1 (3 semaines de charge progressive, 1 semaine d'assimilation/récupération ramenée au plancher de 8h), avec pour exception le Bloc 1 (4 semaines progressives sans semaine d'assimilation car sortie directe de coupure).
    2. Règle absolue d'affûtage pré-course : la semaine précédant toute cyclosportive (Paris-Nice, Madone-Peille, GFNY, Lazardières, Vençoise, Bonette), le volume est allégé de 40 à 50% (environ 7-8h) avec maintien de courts rappels d'intensité (déblocage Z4/PMA très court) pour garantir un TSB positif et une tonicité maximale le jour J.
    3. Règle de récupération post-course : régénération active après les cyclos. Exception pour le post-Paris-Nice Challenge : décompression active limitée au début de semaine (lundi-jeudi, vélotaf très souple) pour attaquer le premier stimulus de PMA dès la fin de semaine (samedi) afin de préparer de façon optimale la Madone-Peille (à J+22) et la GFNY Cannes.
    4. Sprints en Phase 1 (hiver) : intégration systématique de rappels de sprints courts alactiques (10-15s max, récup complète 3-4 min) en fin de sortie Z2 (maintien recrutement fibres rapides et commande motrice sans acide lactique) et de départs arrêtés / sprints à fort couple (torque) en bosse pour le renforcement musculaire spécifique.
    5. Intégration stricte des contraintes : 2 jours de repos/semaine (lundi/vendredi), vélotaf mardi/mercredi (2h10 AR), séances en semaine (hors vélotaf, ex: jeudi) plafonnées à max 2h sur la pause déjeuner, sortie longue samedi (cols niçois 5 à 6h), trail le dimanche au moins un WE sur deux (1 à 2h), renforcement musculaire 2x/semaine.
    6. Protocole de tests terrain : abandon du test 20 min classique au profit du protocole de terrain 3 min + 12 min en côte (avec 20 min de récup Z1 entre les deux). Deux dates programmées : début janvier 2027 (début Bloc 4 pour calibrer Sweet Spot et Seuil) et mi-février 2027 (fin Bloc 5 pour valider la progression et fixer le pacing du Paris-Nice Challenge).
    7. Rôle de canalisateur du coach : Cyril a le moteur et le besoin de « se faire mal » pour franchir des caps. Le coach n'est pas frileux sur les blocs de charge et les intensités ciblées (semaines chocs de cols, Seuil, PMA), où l'exigence est maximale. En revanche, le rôle de modérateur s'exerce avec fermeté pour préserver la facilité des séances d'endurance Z2/vélotaf, imposer l'assimilation et le repos post-choc, et poser un veto absolu dès que des signaux inquiétants apparaissent (score de sommeil bas, forte dérive cardiaque anormale) afin de désamorcer une infection en incubation avant que l'illusion trompeuse du « tout va bien » ne cloue l'athlète au lit.

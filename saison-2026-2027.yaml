# Objectifs et architecture de saison.
# Rempli par Cyril, puis complete par l'agent apres validation explicite
# de chaque etape de la construction.

saison: 2026-2027
debut: 2026-10-01

federations:
  pratiquees: [FFC, FSGT, cyclosportive]
  prioritaire: null

# Hierarchie des courses :
#   A : pic de forme, affutage 2 semaines
#   B+ : B renforce, blocs precedents orientes course, affutage 7 jours complet
#   B : mini-affutage 5-7 jours
#   C : courue dans la charge, 2 jours de fraicheur (vendredi repos + samedi court)
objectifs:
  principal:
    nom: "MERCAN’TOUR BONETTE DT SWISS"
    date: "2027-06-13"
    priorite: A
    type: cyclo
    parcours : "177 KM – 4800 D+"
    profil: montagne              # plat | vallonne | montagne
    notes: si pas assez pret je passerai sur le petit parcours 110km 3000 D+
  secondaires:
  - nom: "Paris nice challenge"
    date: "2027-03-13"
    priorite: C
    type: cyclo
    parcours: "150 KM – 3500 D+"
    profil: montagne
    notes: "Non chronometree : courue dans la charge (jeudi Z2 souple + activation, vendredi repos). Repetition generale de Madone-Peille : cols a l'allure Madone, test nutrition, sans aller au bout de soi."
  - nom: "Mercan'Tour Madone-Peille"
    date: "2027-04-04"
    priorite: B+
    type: cyclo
    parcours: "110 KM – 2800 D+"
    profil: montagne
    notes: "Premier vrai objectif de la saison (B renforce : blocs 06 et 07 orientes Madone, affutage 7 jours). Parcours 100% montagne : 3 grands cols (km 30-43 à 1000m, km 50-62 à 1200m, Madone finale km 88-100 avec 800m D+ d'un bloc). Gestion W/kg sur efforts longs (30-45 min) et gros D+ au km (26m/km)."
  - nom: "GFNY CANNES"
    date: "2027-04-11"
    priorite: B
    type: cyclo
    parcours: "110 KM – 2000 D+"
    profil: vallonne
    notes: "objectif B, une semaine apres Madone-Peille"
  - nom: "LA LAZARIDES CANNES"
    date: "2027-04-17"
    priorite: C
    type: cyclo
    parcours: "112 KM – 1800 D+"
    profil: vallonne
    notes: "Samedi, 6 jours apres le GFNY et 13 jours apres Madone-Peille : 3e course du triptyque d'avril, courue sans affutage sur la fraicheur post-GFNY"
  - nom: "GRANFONDO LA VENCOISE"
    date: "2027-05-08"
    priorite: B
    type: cyclo
    parcours: "147 KM – 2800 D+"
    profil: vallonne
    notes: "Samedi. Passee en B le 09/11/2026 : 3 semaines apres la Lazarides, assimilation faite, objectif de performance. Mini-affutage 7 jours sans couper le volume (derniere seance dure le samedi 01/05)"
  - nom: "CYCLOSPORTIVE DRAPOISE SOUVENIR RENE VIETTO"
    date: "2027-05-23"
    priorite: B+
    type: cyclo
    parcours: "117 KM – 2750 D+"
    profil: montagne
    notes: "Dimanche. Priorite juste apres la Bonette, sur les routes d'entrainement de Cyril (B+ : affutage 7 jours complet, blocs orientes). Depart Drap (06), col de Braus par les deux versants, vallees du Paillon et de la Bevera, chrono jusqu'au sommet du col de Calaisson (104,5 km chronometres + 12,5 km de liaison). Petit parcours 86 km – 2000 D+. Tombe a J-21 de la Bonette. Source : https://cyclosportivevietto.com/parcours-cyclosportive-drapoise-souvenir-rene-vietto/"
  - nom: "Cimes Mercantour"
    date: "debut aout 2027"
    priorite: a definir apres la Bonette
    type: cyclo
    parcours: "100 KM – 2800 D+"
    profil: montagne
  commentaires : "je vais peut etre pas toutes les faires et aussi integrer des courses FFC/FSGT"

indisponibilites_connues:
  - du: 2026-12-17
    au: 2026-12-20
    motif: Paris, course a pied uniquement
  - du: 2026-12-24
    au: 2026-12-25
    motif: fetes, velo possible a partir du 26/12

# Rempli apres l'etape "architecture de saison" validee en conversation.
blocs:
  - id: bloc-01
    nom: Reprise & Capacité Aérobie
    du: 2026-10-05
    au: 2026-10-25
    duree_semaines: 3
    objectif: reconstruire la base aerobie, le rythme moteur et les adaptations tendineuses
    focus: [Z2, sprints_courts_alactiques, reprise_trail, ppg]
    volume_cible_h: [10, 12]
    rythme: "3 semaines progressives (10h -> 10h15 -> 12h, sortie longue 5h en S3) sans assimilation, reduit de 4 a 3 semaines car reprise sans fatigue"
    fichier: blocs/bloc-01.yaml

  - id: bloc-02
    nom: Force Sous-Max & Couple (Torque)
    du: 2026-10-26
    au: 2026-11-22
    duree_semaines: 4
    objectif: developper la force musculaire en col et le recrutement neuro en bosse
    focus: [force_basse_cadence_z3_jeudi, sprints_depart_arrete, sortie_longue_5h_5h30]
    volume_cible_h: [10, 13.5]
    rythme: "Cycle 3:1 -> S1 12h, S2 13h, S3 13h30, S4 assimilation 10h (premiere assimilation apres 6 semaines de charge : si sommeil/FC repos/VFC clignotent, S3 devient l'assimilation)"
    ajustement: "08/11 : clause appliquee. S3 (W46) = assimilation (VFC en baisse, FC repos 57, meteo pluvieuse) ; S4 (W47) = passerelle force courte Z4-Z5 vers le bloc PMA, sous condition sante, sans sortie longue (formation + WE en famille), 5h15 a 9h35. Dates du bloc inchangees. Bloc 3 : S1 plafonnee a +30 % du reel de la W47."
    fichier: blocs/bloc-02.yaml

  - id: bloc-03
    nom: PMA Concentrée
    du: 2026-11-23
    au: 2026-12-13
    duree_semaines: 3
    objectif: elever le plafond aerobie (PMA, point faible relatif 5min/20min = 1.11) avant les blocs sweet spot et seuil
    focus: [pma_z5_concentree, sortie_longue_avec_series_pma, maintien_sprints, endurance_z2_stricte]
    volume_cible_h: [12, 13.5]
    rythme: "3 semaines de charge PMA (12h, 13h, 13h30) : 3 seances PMA/semaine (jeudi midi, serie dans la sortie longue du samedi, dimanche), 2 seances les WE de trail. Assimilation assuree par la periode decharge-fetes qui suit."
    garde_fous: "bloc le plus traumatisant de l'hiver : Z2 et velotaf strictement souples. Sommeil degrade, FC repos +5 bpm ou VFC en chute -> on supprime d'abord la seance du dimanche"

  - id: decharge-fetes
    nom: Décharge Paris & Fêtes
    du: 2026-12-14
    au: 2026-12-27
    duree_semaines: 2
    objectif: assimiler le bloc PMA en respectant les indisponibilites
    focus: [assimilation, z2_libre, course_a_pied_paris]
    volume_cible_h: [4, 10]
    rythme: "S1 (Paris) : lundi repos, velotaf mardi-mercredi, footing libre a Paris jeudi-dimanche (~4-5h velo) -> S2 (fetes) : velotaf jusqu'au 23/12, repos 24-25, sorties Z2 libres 26-27 (~8-10h)"

  - id: bloc-04
    nom: Sweet Spot Extensif
    du: 2026-12-28
    au: 2027-01-24
    duree_semaines: 4
    objectif: allonger le temps de soutien au Sweet Spot en col et repousser l'apparition de la fatigue
    focus: [test_terrain_3m_12m, sweet_spot_long, entretien_pma_jeudi, endurance_fatigue]
    test: "Test 1 terrain 3 min + 12 min le samedi 02/01 ou dimanche 03/01, frais apres deux semaines legeres, pour calibrer les zones Sweet Spot / Seuil"
    volume_cible_h: [10, 14]
    rythme: "Cycle 3:1 -> S1 11h (test), S2 13h, S3 14h, S4 assimilation 10h. Entretien PMA court le jeudi tous les 7 a 10 jours. Samedi sweet spot en col (2x30' ou 3x20')"

  - id: bloc-05
    nom: Seuil Z4 & Over-Unders
    du: 2027-01-25
    au: 2027-02-21
    duree_semaines: 4
    objectif: elever le seuil et entrainer le recyclage du lactate en montagne
    focus: [seuil_z4, over_unders, entretien_pma_jeudi, resistance_dplus, test_controle_fevrier]
    test: "Test 2 de contrôle 3 min + 12 min le samedi 20/02, en fin d'assimilation, pour valider la progression et fixer le pacing de Madone-Peille (et de la repetition au Paris-Nice Challenge)"
    volume_cible_h: [10, 14]
    rythme: "Cycle 3:1 -> S1 12h30, S2 13h30, S3 14h, S4 assimilation 10h + test. Week-ends alternes : A = samedi sortie longue 5-6h avec series seuil en col + dimanche trail ; B = samedi intensites en col 3h-3h30 + dimanche sortie longue sur fatigue 4h30-5h"

  - id: bloc-06
    nom: Seuil Long en Col & Volume Montagne
    du: 2027-02-22
    au: 2027-03-14
    duree_semaines: 3
    objectif: allonger le seuil en col sur des efforts de 30-45 min (format Madone-Peille) et repeter l'allure de course sur le Paris-Nice Challenge
    focus: [seuil_long_cols_30_45min, pacing_madone, entretien_pma, pnc_repetition_generale]
    course: "Paris Nice Challenge (samedi 13 mars 2027 - 150 km, 3500 D+) - priorite C, courue dans la charge"
    volume_cible_h: [12.5, 13.5]
    rythme: "3 semaines de charge -> S1 12h30, S2 13h30 seuil long en col -> S3 ~13h course comprise (jeudi Z2 souple + activation courte, vendredi repos, PNC samedi aux allures Madone, dimanche Z1 court ou repos). Trail le WE du 06-07/03."

  - id: bloc-07
    nom: Montagne de Printemps, Madone & GFNY
    du: 2027-03-15
    au: 2027-04-11
    duree_semaines: 4
    objectif: assimiler les 3 semaines de charge du bloc 06, rappel PMA concentre, puis arriver au pic sur Madone-Peille (premier objectif) et enchainer GFNY sur la fraicheur
    focus: [assimilation_post_bloc06, rappel_pma_concentre, seuil_cols_longs, affutage_madone_7j, fraicheur_gfny]
    courses:
      - "Mercan'Tour Madone-Peille (dimanche 04 avril 2027) - priorite B renforcee, premier objectif"
      - "GFNY Cannes (dimanche 11 avril 2027) - priorite B"
    volume_cible_h: [10, 12.5]
    rythme: "S1 assimilation (10h, cloture le 3:1 du bloc 06 et du PNC) -> S2 rappel PMA concentre (3 seances) & cols au format Madone (12h30) -> S3 affutage 7 jours & Madone-Peille (~10h30 course comprise) -> S4 recup active lundi-mercredi, activation jeudi + samedi, GFNY (~10h course comprise)"

  - id: bloc-08
    nom: Lazaridès & Charge Cyclos de Mai
    du: 2027-04-12
    au: 2027-05-09
    duree_semaines: 4
    objectif: clore le triptyque d'avril (Madone, GFNY, Lazarides en 14 jours), assimiler, recharger puis faire une performance sur la Vencoise
    focus: [recup_activation_post_gfny, lazarides_c, assimilation_triptyque, seuil_long_cols, entretien_pma, vencoise_b]
    courses:
      - "La Lazarides Cannes (samedi 17 avril 2027) - priorite C, 6 jours apres le GFNY"
      - "Granfondo La Vencoise (samedi 8 mai 2027) - priorite B"
    volume_cible_h: [10, 12.5]
    rythme: "S1 (12-18/04, ~10h30 course comprise) : recup GFNY lundi-mercredi (velotaf Z2 souple), jeudi Z2 court + deblocages, vendredi repos, Lazarides samedi, dimanche Z2 souple 2-3h -> S2 (19-25/04) assimilation 10-11h, aucune intensite, samedi 5h Z2 -> S3 (26/04-02/05) charge 12h30, PMA jeudi, samedi 01/05 seuil long en col = derniere seance dure, dimanche Z2 souple -> S4 (03-09/05) mini-affutage Vencoise ~12h30 course comprise : velotaf Z2, jeudi deblocages courts, vendredi repos, Vencoise samedi a fond, dimanche Z2 souple 2h"
    garde_fous: "si le GFNY a vide Cyril (sommeil, FC repos, VFC), la Lazarides se court en controle ou est abandonnee : c'est une C, elle passe apres la Drapoise et la Bonette"
    decision: "2026-11-09 : dates exactes recues, Lazarides avancee au 17/04. L'assimilation passe en S2 (apres 3 courses en 14 jours), les 3 semaines de charge glissent du 26/04 au 16/05. Valide par Cyril. 2026-11-09 : Vencoise passee en B a la demande de Cyril ; la semaine du 03/05 devient un mini-affutage qui garde le volume (la course compte), la charge du bloc 9 S1 (14h) reste en place."

  - id: bloc-09
    nom: Spécifique Haute Montagne & Affûtage Bonette
    du: 2027-05-10
    au: 2027-06-13
    duree_semaines: 5
    objectif: pic de forme absolu pour le monument de la saison (177 km, 4800 D+)
    focus: [cols_longs_format_drapoise, drapoise_b_plus, choc_final_bonette, pacing_bonette, nutrition_course, entretien_pma, affutage_deux_semaines]
    courses:
      - "Cyclosportive Drapoise Souvenir René Vietto (dimanche 23 mai 2027 - 117 km, 2750 D+) - priorite B+, a J-21 de la Bonette, sur les routes d'entrainement"
      - "MERCAN’TOUR BONETTE DT SWISS (dimanche 13 juin 2027 - 177 km, 4800 D+) - priorite A"
    test: "Test 3 supprime : la Drapoise courue a fond (Braus puis chrono jusqu'a Calaisson) et Madone-Peille servent de reference pour le pacing Bonette"
    volume_cible_h: [10.5, 14]
    rythme: "S1 (10-16/05) derniere grosse semaine 14h, cols longs au format Drapoise/Bonette -> S2 (17-23/05) affutage 7 jours (deblocages courts, vendredi repos, samedi activation) et Drapoise a fond (~11h course comprise) -> S3 (24-30/05) recup lundi-mercredi, seuil court jeudi, dernier choc samedi 29 (5h30-6h a l'allure Bonette, nutrition 90 g/h), dimanche Z2 2-3h (~12h30) -> S4 (31/05-06/06) affutage S-2 (~10h30), reconnaissance Bonette si route ouverte -> S5 (07-13/06) affutage final S-1 (~6h hors course, deblocages courts, TSB +10 le 13 juin)"
    decision: "2026-10-28 : Drapoise integree a J-14, on renonce au pic a 15h. 2026-11-09 : date exacte au 23/05 (J-21), Drapoise passee en B+ ; S1 devient la derniere semaine de charge (l'assimilation a glisse au 19/04), la semaine d'affutage Drapoise ferme le 3:1, un dernier choc s'insere a J-15 avant les 2 semaines d'affutage. Valide par Cyril."
    terrain: "haute montagne probablement fermee mi-mai : chocs sur Madone, Turini, Couillole, Colmiane, Valberg"

  - id: bloc-10
    nom: Après-Bonette (à construire)
    du: 2027-06-14
    au: null
    objectif: a definir apres la Bonette selon emploi du temps et performances
    focus: [recuperation_post_bonette]
    rythme: "seul jalon connu : Cimes du Mercantour (debut aout 2027). Autres courses eventuelles decidees plus tard par Cyril. Structure a construire le moment venu."

# Synthese validee de la session de construction du programme.
# C'est le document de reference : l'agent s'y appuie pour construire
# chaque nouveau bloc.
synthese_construction:
  date: "2026-10-17"
  texte: >
    Cadrage saison 2026/2027 validé avec Cyril le 12/09/2026, révisé le 17/10/2026
    après analyse de cohérence (bloc 1 réduit à 3 semaines, bloc PMA concentré en
    décembre, hiérarchie A/B/C des courses, respect de la règle des ±30 % de volume).
    Reprise officielle le lundi 05/10/2026 après coupure régénératrice du 23/09 au 04/10.
    FTP de référence 310 W (déclaré).
    Volume disponible : entre 8h et 15h de selle pure par semaine (hors renforcement musculaire).
    Règles physiologiques cardinales du plan :
    1. Structure des mésocycles : cycle 3:1 (3 semaines de charge progressive, 1 semaine d'assimilation à ~10h). La semaine d'assimilation garde la sortie du samedi (5h en Z2 souple, sprints alactiques autorisés) et supprime toute autre intensité. Pics de charge plafonnés à 14h (15h uniquement en choc Bonette) pour que la variation hebdomadaire reste dans ±30 %, à la hausse comme à la baisse. Exceptions : bloc 1 (3 semaines sans assimilation, sortie de coupure) et bloc 3 PMA (assimilation assurée par la décharge Paris/fêtes).
    2. Volume d'une semaine de course : la course compte dans le volume. La fraîcheur s'obtient en baissant l'intensité, pas en effondrant le volume.
    3. Hiérarchie des courses et affûtage : A (Bonette) = affûtage 2 semaines, TSB ~+10 ; B+ (Madone-Peille, Drapoise) = affûtage 7 jours complet, blocs précédents orientés course ; B (GFNY Cannes, Vençoise) = mini-affûtage 5-7 jours (déblocages courts, vendredi repos, samedi activation ou course) ; C (Paris-Nice, Lazaridès) = courue dans la charge avec 2 jours de fraîcheur, utilisée comme séance clé.
    4. PMA en bloc : un bloc PMA concentré en décembre (bloc 3, jusqu'à 3 séances/semaine dans la limite de 3 séances dures et 2 jours durs consécutifs), entretien court le jeudi tous les 7 à 10 jours de janvier à mars, rappel concentré d'une semaine en S2 du bloc 7 (post Paris-Nice), entretien sur le bloc Bonette.
    5. Récupération post-course : régénération active en Z1/Z2 souple. Post-Paris-Nice : une semaine de récupération avant le rappel PMA. Entre Madone-Peille et GFNY : récupération lundi-mercredi, activation jeudi et samedi.
    6. Sprints en Phase 1 (hiver) : rappels de sprints courts alactiques (10-15s max, récup complète 3-4 min) en fin de sortie Z2 et départs arrêtés à fort couple en bosse.
    7. Intégration stricte des contraintes : 2 jours de repos/semaine (lundi/vendredi), vélotaf mardi/mercredi (2h10 AR) toujours en Z2, séance du jeudi plafonnée à 2h sur la pause déjeuner, sortie longue 5-6h chaque semaine, renforcement musculaire 2x/semaine tout l'hiver (hors quota selle). Trail un dimanche sur deux, supprimé les week-ends de course (décision de Cyril : le trail est secondaire).
    8. Week-ends alternés à partir du bloc 5 : A = samedi sortie longue 5-6h avec séries de seuil ou d'allure course en col + dimanche trail ; B = samedi intensités spécifiques en col 3h-3h30 + dimanche sortie longue de volume sur fatigue 4h30-5h.
    9. Protocole de tests terrain 3 min + 12 min en côte (20 min Z1 entre les deux) : 02-03/01/2027 (bloc 4), 20/02/2027 (fin bloc 5). Le test optionnel du 15/05 est supprimé (révision du 09/11/2026) : la Drapoise sert de référence pour le pacing Bonette.
    10. Maladie : aucune séance rattrapée. Une semaine de charge touchée par 3 jours de maladie ou plus devient une semaine d'assimilation ; si le calendrier coince, on retire une semaine de charge, jamais une assimilation.
    11. Rôle de canalisateur du coach : exigence maximale sur les blocs de charge et les intensités ciblées (bloc PMA, seuil, chocs de cols) ; fermeté sur la facilité des séances Z2/vélotaf, l'assimilation post-choc et le veto dès que des signaux inquiétants apparaissent (sommeil bas, dérive cardiaque anormale, FC repos en hausse, VFC en chute).
